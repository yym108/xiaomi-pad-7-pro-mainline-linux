# Install to: /etc/keyd/xiaomi-keyboard.conf (requires `keyd` service enabled)
[ids]
# Xiaomi Pad 7 Pro Magnetic Keyboard (Nanosic WN8030)
15d9:00a3

[main]
# Tap CapsLock = normal CapsLock; Hold CapsLock = F1-F12 layer
capslock = overload(fn_layer, capslock)

[fn_layer]
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
- = f11
= = f12
