monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.disable-mmap = true
        api.alsa.disable-tsched = true
        api.alsa.period-size = 1920
        api.alsa.periods = 4
        api.alsa.headroom = 1920
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
      }
    }
  }
]
