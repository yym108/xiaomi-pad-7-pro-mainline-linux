SectionVerb {
	EnableSequence [
		cset "name='QUINARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
		cset "name='SpkrTopLeft Profile Set' 0"
		cset "name='SpkrBotLeft Profile Set' 0"
		cset "name='SpkrTopRight Profile Set' 0"
		cset "name='SpkrBotRight Profile Set' 0"
		cset "name='SpkrTopLeft PCM Playback Volume' 295"
		cset "name='SpkrBotLeft PCM Playback Volume' 295"
		cset "name='SpkrTopRight PCM Playback Volume' 295"
		cset "name='SpkrBotRight PCM Playback Volume' 295"
		cset "name='SpkrTopLeft Playback Switch' 1"
		cset "name='SpkrBotLeft Playback Switch' 1"
		cset "name='SpkrTopRight Playback Switch' 1"
		cset "name='SpkrBotRight Playback Switch' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Quad AW88261 Speakers"

	EnableSequence [
		cset "name='QUINARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='SpkrTopLeft Playback Switch' 1"
		cset "name='SpkrBotLeft Playback Switch' 1"
		cset "name='SpkrTopRight Playback Switch' 1"
		cset "name='SpkrBotRight Playback Switch' 1"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Built-in Stereo Microphones (WCD9395)"

	EnableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 14"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='ADC3_MIXER Switch' 1"
		cset "name='ADC3 MUX' CH3_AMIC3"
		cset "name='ADC3 Switch' 1"
		cset "name='ADC3 Volume' 14"
		cset "name='TX2 MODE' ADC_NORMAL"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 102"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC2"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC1 Volume' 102"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC3_MIXER Switch' 0"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
		CaptureRate 48000
	}
}
